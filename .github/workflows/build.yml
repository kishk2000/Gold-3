name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Verify Java 17
      run: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"
        "$JAVA_HOME/bin/java" -version

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Verify Cordova and Gradle environment
      run: |
        cordova --version
        echo "JAVA_HOME=$JAVA_HOME"
        java -version

    - name: Extract zip and Create Cordova App
      run: |
        cordova create cordovaApp com.goldlive.app "GOLD LIVE"
        cd cordovaApp

        cordova platform add android@12.0.0

        # استخراج الملف وتجهيز index.html
        unzip -o ../stitch_gold_live_egy*.zip -d temp_zip || true

        FOUND_FILE=$(find temp_zip .. -maxdepth 3 -name "*.html" | head -n 1)

        if [ -n "$FOUND_FILE" ]; then
          cp "$FOUND_FILE" www/index.html
        else
          echo "HTML File not found!"
          exit 1
        fi

    - name: Build APK
      run: |
        cd cordovaApp
        export JAVA_HOME="${JAVA_HOME}"
        export PATH="${JAVA_HOME}/bin:${PATH}"
        java -version
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GOLD-LIVE-APK
        path: cordovaApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
